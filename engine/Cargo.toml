[package]
name = "solverforge-planner"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Stateless SolverForge task-scheduling engine: JSON problem in, proposal out"
license = "MIT"
repository = "https://github.com/blackopsrepl/hermes-solverforge-planner"
publish = false

[[bin]]
name = "solverforge-planner"
path = "src/main.rs"

[dependencies]
solverforge = "0.23.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

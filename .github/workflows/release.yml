name: engine release

# Builds the engine for every supported platform from one Linux runner, attests
# each binary's build provenance, and publishes them with SHA256SUMS on the
# GitHub release for the tag. Engine releases have their own tags
# (engine-vX.Y.Z) because the plugin pins their checksums in engine_bin.py,
# which can only happen after the binaries exist; plugin releases (vX.Y.Z)
# follow and contain those pins.

on:
  push:
    tags: ["engine-v*"]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy, rustfmt
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine checks
        working-directory: engine
        run: |
          cargo fmt --check
          cargo clippy --release --all-targets --locked -- -D warnings
          cargo test --release --locked
      - name: Plugin tests against the engine just built
        env:
          SOLVERFORGE_PLANNER_BIN: ${{ github.workspace }}/engine/target/release/solverforge-planner
        run: make test-plugin
      - name: Desktop render tests
        run: make test-desktop
      - name: Tag matches the engine version
        run: |
          tag="${GITHUB_REF_NAME#engine-v}"
          grep -q "^version = \"$tag\"" engine/Cargo.toml
          grep -q "^ENGINE_VERSION = \"$tag\"" engine_bin.py

  build:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          targets: ${{ matrix.target }}
      - name: Install zig and cargo-zigbuild
        run: |
          pip install ziglang==0.17.0
          cargo install --locked cargo-zigbuild@0.24.1
      - name: Build
        run: scripts/build-engine.sh ${{ matrix.target }}
      - name: Smoke-test the Linux x86_64 binary
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: dist/solverforge-planner-x86_64-unknown-linux-musl --version
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/solverforge-planner-*
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          path: dist/solverforge-planner-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#engine-v}" >> "$GITHUB_OUTPUT"
      - name: Checksums
        working-directory: dist
        run: sha256sum solverforge-planner-* | tee SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          name: Planning engine ${{ steps.version.outputs.version }}
          make_latest: "false"
          body: |
            The planning engine used by SolverForge Planner. Binaries for Linux (x86_64, arm64; static musl), macOS
            (Apple silicon, Intel) and Windows (x86_64), built from `engine/` at this tag.

            You do not need to download these by hand: `hermes solverforge-planner install`
            fetches the one for your platform and checks it against the SHA-256 pinned in the
            plugin. Each binary carries a build attestation:

            ```sh
            gh attestation verify solverforge-planner-<target> --repo ${{ github.repository }}
            ```

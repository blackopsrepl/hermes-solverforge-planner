<!doctype html>
<!-- The catalog banner (1200x600, 2:1). Render: make images -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 600px; overflow: hidden; }
  body {
    background:
      radial-gradient(circle at 26% 55%, rgba(34, 197, 94, 0.16), transparent 45%),
      #04140c;
    color: #ecfdf5;
    font-family: "Fira Sans";
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(34, 197, 94, 0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34, 197, 94, 0.07) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .mascot { position: absolute; left: 36px; top: 40px; width: 540px; }
  .copy { position: absolute; left: 610px; top: 112px; width: 550px; }
  .kicker {
    font-family: "Fira Code"; font-size: 20px; letter-spacing: 0.12em;
    color: #4ade80; text-transform: uppercase;
  }
  h1 { margin: 18px 0 0; font-size: 60px; line-height: 1.04; font-weight: 700; }
  p { margin: 26px 0 0; font-size: 25px; line-height: 1.4; color: #bbf7d0; }
  .score {
    display: inline-block; margin-top: 30px; padding: 8px 16px;
    font-family: "Fira Code"; font-size: 22px; color: #04140c;
    background: #4ade80; border-radius: 6px;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <img class="mascot" src="../mascot.png" alt="">
  <div class="copy">
    <div class="kicker">Hermes plugin</div>
    <h1>SolverForge<br>Planner</h1>
    <p>Plans your tasks around your meetings, and proves every hard rule holds.</p>
    <div class="score">0hard/0medium</div>
  </div>
</body>
</html>
